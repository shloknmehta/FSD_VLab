<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" />
  <circle cx="128" cy="128" r="112" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.4" />

  <!-- Code Bracket Left '<' -->
  <path d="M 48 105 L 26 128 L 48 151" fill="none" stroke="#ff6600" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Bracket Right '>' -->
  <path d="M 208 105 L 230 128 L 208 151" fill="none" stroke="#ff6600" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Flask Liquid -->
  <path d="M 92 142 L 164 142 L 194 192 C 188 204, 180 206, 128 206 C 76 206, 68 204, 62 192 Z" fill="url(#liquidGrad)" />
  <path d="M 92 142 Q 128 138 164 142" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" />

  <!-- Bubbles -->
  <circle cx="122" cy="172" r="5" fill="#ffffff" opacity="0.8" />
  <circle cx="145" cy="158" r="3.5" fill="#ffffff" opacity="0.7" />
  <circle cx="108" cy="184" r="3" fill="#ffffff" opacity="0.6" />

  <!-- Flask Glass Body -->
  <!-- Top lip -->
  <line x1="104" y1="58" x2="152" y2="58" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <!-- Flask outline -->
  <path d="M 112 58 L 112 98 L 60 192 C 54 202, 62 208, 76 208 L 180 208 C 194 208, 202 202, 196 192 L 144 98 L 144 58" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Slash '/' in neck -->
  <line x1="136" y1="72" x2="120" y2="94" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
</svg>