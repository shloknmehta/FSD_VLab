<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="skyHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadowComp" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="460" rx="16" fill="url(#compBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(40, 28)">
    <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">FORM VALIDATION COMPARISON</text>
    <text x="0" y="24" fill="#f8fafc" font-size="20" font-weight="800">Field-Level clean_&lt;field&gt;() vs Form-Level clean()</text>
  </g>

  <!-- Left Column: clean_<field>() -->
  <g transform="translate(40, 75)" filter="url(#shadowComp)">
    <rect width="425" height="350" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <path d="M 0 12 Q 0 0 12 0 L 413 0 Q 425 0 425 12 L 425 42 L 0 42 Z" fill="url(#skyHeader)"/>
    <text x="20" y="27" fill="#ffffff" font-size="14" font-weight="800">1. Field-Level: clean_&lt;fieldname&gt;(self)</text>

    <!-- Scope -->
    <g transform="translate(20, 60)">
      <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700">TARGET SCOPE</text>
      <text x="0" y="32" fill="#f1f5f9" font-size="12.5" font-weight="600">Single Field Isolation (e.g. clean_age, clean_email)</text>
      <text x="0" y="48" fill="#94a3b8" font-size="11">Only has authority and context over its own field value.</text>
    </g>

    <!-- Execution Order -->
    <g transform="translate(20, 125)">
      <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700">EXECUTION TRIGGER</text>
      <text x="0" y="32" fill="#f1f5f9" font-size="12.5" font-weight="600">Runs during _clean_fields()</text>
      <text x="0" y="48" fill="#94a3b8" font-size="11">Immediately after field-type coercion succeeds.</text>
    </g>

    <!-- Data Access -->
    <g transform="translate(20, 190)">
      <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700">INPUT DATA EXTRACTION</text>
      <rect x="0" y="22" width="385" height="26" rx="4" fill="#1e293b"/>
      <text x="10" y="39" fill="#7dd3fc" font-size="11" font-family="monospace">age = self.cleaned_data.get('age')</text>
    </g>

    <!-- Return Contract -->
    <g transform="translate(20, 255)">
      <text x="0" y="14" fill="#f59e0b" font-size="11" font-weight="800">CRITICAL RETURN CONTRACT</text>
      <rect x="0" y="22" width="385" height="52" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="38" fill="#fef3c7" font-size="11" font-weight="700">MUST return the cleaned field value!</text>
      <text x="10" y="54" fill="#cbd5e1" font-size="10.5">Returning None replaces valid data with None in cleaned_data.</text>
    </g>

    <!-- Error Destination -->
    <g transform="translate(20, 325)">
      <text x="0" y="12" fill="#94a3b8" font-size="10">Errors attached to: </text>
      <text x="96" y="12" fill="#f87171" font-size="10" font-family="monospace">form.errors['&lt;fieldname&gt;']</text>
    </g>
  </g>

  <!-- Right Column: clean() -->
  <g transform="translate(495, 75)" filter="url(#shadowComp)">
    <rect width="425" height="350" rx="12" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <path d="M 0 12 Q 0 0 12 0 L 413 0 Q 425 0 425 12 L 425 42 L 0 42 Z" fill="url(#emeraldHeader)"/>
    <text x="20" y="27" fill="#ffffff" font-size="14" font-weight="800">2. Form-Level: clean(self)</text>

    <!-- Scope -->
    <g transform="translate(20, 60)">
      <text x="0" y="14" fill="#34d399" font-size="11" font-weight="700">TARGET SCOPE</text>
      <text x="0" y="32" fill="#f1f5f9" font-size="12.5" font-weight="600">Cross-Field Multi-Attribute Validation</text>
      <text x="0" y="48" fill="#94a3b8" font-size="11">Compares dependencies between two or more form inputs.</text>
    </g>

    <!-- Execution Order -->
    <g transform="translate(20, 125)">
      <text x="0" y="14" fill="#34d399" font-size="11" font-weight="700">EXECUTION TRIGGER</text>
      <text x="0" y="32" fill="#f1f5f9" font-size="12.5" font-weight="600">Runs during _clean_form()</text>
      <text x="0" y="48" fill="#94a3b8" font-size="11">Executed after ALL individual fields have completed cleaning.</text>
    </g>

    <!-- Data Access -->
    <g transform="translate(20, 190)">
      <text x="0" y="14" fill="#34d399" font-size="11" font-weight="700">INPUT DATA EXTRACTION</text>
      <rect x="0" y="22" width="385" height="26" rx="4" fill="#1e293b"/>
      <text x="10" y="39" fill="#a7f3d0" font-size="11" font-family="monospace">p1 = cleaned_data.get('password')</text>
    </g>

    <!-- Return Contract -->
    <g transform="translate(20, 255)">
      <text x="0" y="14" fill="#f59e0b" font-size="11" font-weight="800">CRITICAL RETURN CONTRACT</text>
      <rect x="0" y="22" width="385" height="52" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="38" fill="#fef3c7" font-size="11" font-weight="700">MUST return the complete cleaned_data dictionary!</text>
      <text x="10" y="54" fill="#cbd5e1" font-size="10.5">Always call super().clean() first to retain cleaned fields.</text>
    </g>

    <!-- Error Destination -->
    <g transform="translate(20, 325)">
      <text x="0" y="12" fill="#94a3b8" font-size="10">Errors attached to: </text>
      <text x="96" y="12" fill="#f87171" font-size="10" font-family="monospace">form.errors['__all__'] (Non-field)</text>
    </g>
  </g>
</svg>
