<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="reqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadowReq" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="960" height="440" rx="16" fill="url(#reqBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(40, 28)">
    <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">PATTERNS &amp; ARCHITECTURE</text>
    <text x="0" y="24" fill="#f8fafc" font-size="20" font-weight="800">The Django View Form Workflow: Post/Redirect/Get (PRG) Pattern</text>
  </g>

  <!-- Flow Steps -->
  <!-- Step 1: Client Request -->
  <g transform="translate(40, 80)" filter="url(#shadowReq)">
    <rect width="180" height="130" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="180" height="28" rx="10" fill="#334155"/>
    <text x="90" y="19" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">CLIENT BROWSER</text>
    <text x="90" y="55" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">HTTP GET Request</text>
    <text x="90" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Initial form display</text>
    <line x1="20" y1="88" x2="160" y2="88" stroke="#475569" stroke-width="1"/>
    <text x="90" y="104" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">HTTP POST (Submit)</text>
    <text x="90" y="118" fill="#94a3b8" font-size="9.5" text-anchor="middle">Includes CSRF token</text>
  </g>

  <path d="M 220 145 L 260 145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Step 2: View Handler -->
  <g transform="translate(265, 80)" filter="url(#shadowReq)">
    <rect width="210" height="130" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <rect width="210" height="28" rx="10" fill="#0369a1"/>
    <text x="105" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">DJANGO VIEW FUNCTION</text>
    <text x="16" y="52" fill="#7dd3fc" font-size="11" font-family="monospace">if request.method == 'POST':</text>
    <text x="24" y="68" fill="#e2e8f0" font-size="10.5" font-family="monospace">form = UserForm(request.POST)</text>
    <text x="24" y="84" fill="#e2e8f0" font-size="10.5" font-family="monospace">if form.is_valid(): ...</text>
    <text x="16" y="104" fill="#7dd3fc" font-size="11" font-family="monospace">else:</text>
    <text x="24" y="118" fill="#94a3b8" font-size="10" font-family="monospace">form = UserForm()  # unbound</text>
  </g>

  <path d="M 475 145 L 515 145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Step 3: Decision Gate -->
  <g transform="translate(520, 80)" filter="url(#shadowReq)">
    <rect width="180" height="130" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="180" height="28" rx="10" fill="#b45309"/>
    <text x="90" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">EVALUATION GATE</text>
    <text x="90" y="58" fill="#fef3c7" font-size="14" font-weight="800" text-anchor="middle">form.is_valid()</text>
    <text x="90" y="78" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Runs full_clean()</text>
    <text x="90" y="94" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Checks all fields</text>
    <text x="90" y="112" fill="#38bdf8" font-size="10.5" font-family="monospace" text-anchor="middle">Returns True/False</text>
  </g>

  <!-- Success Branch -->
  <path d="M 700 120 L 755 120 L 755 120 L 770 120" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="735" y="112" fill="#34d399" font-size="11" font-weight="800">TRUE</text>

  <g transform="translate(775, 65)" filter="url(#shadowReq)">
    <rect width="145" height="110" rx="10" fill="#064e3b" stroke="#059669" stroke-width="2"/>
    <text x="72" y="24" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle">VALID DATA</text>
    <text x="72" y="46" fill="#ecfdf5" font-size="10" text-anchor="middle">Extracts cleaned_data</text>
    <text x="72" y="62" fill="#ecfdf5" font-size="10" text-anchor="middle">Executes business logic</text>
    <line x1="12" y1="74" x2="133" y2="74" stroke="#047857" stroke-width="1"/>
    <text x="72" y="92" fill="#a7f3d0" font-size="10.5" font-weight="700" text-anchor="middle">redirect('success')</text>
    <text x="72" y="104" fill="#6ee7b7" font-size="9" text-anchor="middle">Prevents re-POST</text>
  </g>

  <!-- Failure Branch -->
  <path d="M 610 210 L 610 265 L 755 265 L 770 265" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="635" y="255" fill="#f87171" font-size="11" font-weight="800">FALSE (Validation Errors)</text>

  <g transform="translate(775, 215)" filter="url(#shadowReq)">
    <rect width="145" height="110" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="2"/>
    <text x="72" y="24" fill="#f87171" font-size="12" font-weight="800" text-anchor="middle">INVALID DATA</text>
    <text x="72" y="46" fill="#fef2f2" font-size="10" text-anchor="middle">Preserves user input</text>
    <text x="72" y="62" fill="#fef2f2" font-size="10" text-anchor="middle">Attaches form.errors</text>
    <line x1="12" y1="74" x2="133" y2="74" stroke="#991b1b" stroke-width="1"/>
    <text x="72" y="92" fill="#fca5a5" font-size="10.5" font-weight="700" text-anchor="middle">render(request, ...)</text>
    <text x="72" y="104" fill="#fecaca" font-size="9" text-anchor="middle">Inline errorlist rendered</text>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 355)">
    <rect width="880" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" fill="#38bdf8" font-size="11" font-weight="700">CORE TAKEAWAY FROM LITERATURE (Two Scoops of Django, Chapter 10):</text>
    <text x="20" y="42" fill="#94a3b8" font-size="11">Always follow the Post/Redirect/Get pattern upon successful validation to prevent duplicate form submissions on page refresh.</text>
  </g>
</svg>
