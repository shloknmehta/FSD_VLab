<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="16" fill="url(#cnBg)" stroke="#334155" stroke-width="1.5"/>

  <g transform="translate(40, 28)">
    <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">IEEE 802.1Q STANDARD &bull; ETHERNET FRAME STRUCTURE</text>
    <text x="0" y="24" fill="#f8fafc" font-size="20" font-weight="800">4-Byte VLAN Tag Insertion into Standard IEEE 802.3 Frame</text>
  </g>

  <!-- Untagged Standard Frame -->
  <g transform="translate(40, 75)">
    <text x="0" y="16" fill="#94a3b8" font-size="12" font-weight="700">Standard Untagged Ethernet Frame (Delivered to Access Ports / Workstations):</text>
    <g transform="translate(0, 26)">
      <!-- Preamble -->
      <rect x="0" y="0" width="90" height="46" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="45" y="22" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">Preamble/SFD</text>
      <text x="45" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">8 Bytes</text>

      <!-- Dest MAC -->
      <rect x="94" y="0" width="130" height="46" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="159" y="22" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">Destination MAC</text>
      <text x="159" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">6 Bytes</text>

      <!-- Source MAC -->
      <rect x="228" y="0" width="130" height="46" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="293" y="22" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">Source MAC</text>
      <text x="293" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">6 Bytes</text>

      <!-- Type/Len -->
      <rect x="362" y="0" width="100" height="46" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="412" y="22" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">Type / Length</text>
      <text x="412" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">2 Bytes (EtherType)</text>

      <!-- Data Payload -->
      <rect x="466" y="0" width="310" height="46" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="621" y="22" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Data Payload (IPv4 / IPv6 / ARP)</text>
      <text x="621" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">46 to 1500 Bytes</text>

      <!-- FCS -->
      <rect x="780" y="0" width="100" height="46" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="830" y="22" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">FCS (CRC-32)</text>
      <text x="830" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">4 Bytes</text>
    </g>
  </g>

  <!-- Tagged 802.1Q Frame -->
  <g transform="translate(40, 185)">
    <text x="0" y="16" fill="#38bdf8" font-size="12" font-weight="700">Tagged IEEE 802.1Q Frame (Transmitted across Trunk Links):</text>
    <g transform="translate(0, 26)">
      <!-- Preamble -->
      <rect x="0" y="0" width="85" height="48" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="42" y="22" fill="#cbd5e1" font-size="9.5" font-weight="700" text-anchor="middle">Preamble</text>
      <text x="42" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">8 Bytes</text>

      <!-- Dest MAC -->
      <rect x="89" y="0" width="110" height="48" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="144" y="22" fill="#f1f5f9" font-size="10.5" font-weight="700" text-anchor="middle">Dest MAC</text>
      <text x="144" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">6 Bytes</text>

      <!-- Source MAC -->
      <rect x="203" y="0" width="110" height="48" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="258" y="22" fill="#f1f5f9" font-size="10.5" font-weight="700" text-anchor="middle">Source MAC</text>
      <text x="258" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">6 Bytes</text>

      <!-- 802.1Q TAG (4 Bytes) -->
      <rect x="317" y="-6" width="235" height="60" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="434" y="14" fill="#ffffff" font-size="11.5" font-weight="900" text-anchor="middle">IEEE 802.1Q TAG (4 BYTES)</text>
      <text x="434" y="30" fill="#e0f2fe" font-size="9" font-family="monospace" text-anchor="middle">TPID 0x8100 (2B) + TCI (2B)</text>
      <text x="434" y="44" fill="#fef08a" font-size="9" font-weight="700" text-anchor="middle">VLAN ID (12 bits: 1-4094) + PCP + DEI</text>

      <!-- Type/Len -->
      <rect x="556" y="0" width="85" height="48" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="598" y="22" fill="#f1f5f9" font-size="10.5" font-weight="700" text-anchor="middle">EtherType</text>
      <text x="598" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">2 Bytes</text>

      <!-- Data Payload -->
      <rect x="645" y="0" width="150" height="48" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="720" y="22" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Data Payload</text>
      <text x="720" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">42 to 1500 Bytes</text>

      <!-- FCS -->
      <rect x="799" y="0" width="81" height="48" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="839" y="22" fill="#cbd5e1" font-size="10.5" font-weight="700" text-anchor="middle">FCS (CRC)</text>
      <text x="839" y="36" fill="#94a3b8" font-size="9" text-anchor="middle">4 Bytes</text>
    </g>
  </g>

  <!-- Detailed Breakdown Card -->
  <g transform="translate(40, 290)">
    <rect width="880" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="800">CITED FROM TEXTBOOK: Computer Networks (A.S. Tanenbaum &amp; D.J. Wetherall, Pearson, 6th Ed.)</text>
      <text x="0" y="22" fill="#cbd5e1" font-size="11">• TPID (Tag Protocol Identifier): 16 bits set to 0x8100 identifying the frame as 802.1Q tagged.</text>
      <text x="0" y="40" fill="#cbd5e1" font-size="11">• PCP (Priority Code Point): 3 bits for IEEE 802.1p Quality of Service (QoS) class prioritization.</text>
      <text x="0" y="58" fill="#fef08a" font-size="11" font-weight="700">• VID (VLAN Identifier): 12 bits allowing up to 4094 unique VLANs (VLAN 0 and 4095 are reserved).</text>
    </g>
  </g>
</svg>
