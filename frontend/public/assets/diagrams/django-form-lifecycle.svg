<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <g transform="translate(40, 28)">
    <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">DJANGO INTERNALS: ARCHITECTURE SPECIFICATION</text>
    <text x="0" y="24" fill="#f8fafc" font-size="20" font-weight="800">Form Validation Pipeline: full_clean() Execution Sequence</text>
  </g>

  <!-- Stage 1: Ingestion -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="135" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect width="135" height="28" rx="10" fill="#334155"/>
    <text x="67" y="19" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">STAGE 1</text>
    <text x="67" y="52" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">request.POST</text>
    <text x="67" y="70" fill="#64748b" font-size="10" text-anchor="middle">Raw QueryDict</text>
    <text x="67" y="86" fill="#0284c7" font-size="10" font-family="monospace" text-anchor="middle">{'age': '21', ...}</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 175 150 L 205 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Binding & Trigger -->
  <g transform="translate(210, 95)" filter="url(#shadow)">
    <rect width="145" height="110" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="145" height="28" rx="10" fill="url(#blueGrad)"/>
    <text x="72" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">STAGE 2: TRIGGER</text>
    <text x="72" y="52" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">form.is_valid()</text>
    <text x="72" y="70" fill="#94a3b8" font-size="10" text-anchor="middle">calls internal:</text>
    <text x="72" y="86" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle">self.full_clean()</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 355 150 L 385 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Field Level -->
  <g transform="translate(390, 95)" filter="url(#shadow)">
    <rect width="155" height="110" rx="10" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="155" height="28" rx="10" fill="url(#purpleGrad)"/>
    <text x="77" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">STAGE 3: BUILT-IN</text>
    <text x="77" y="50" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">_clean_fields()</text>
    <text x="77" y="68" fill="#c4b5fd" font-size="9.5" text-anchor="middle">• to_python() coercion</text>
    <text x="77" y="82" fill="#c4b5fd" font-size="9.5" text-anchor="middle">• field.validate()</text>
    <text x="77" y="96" fill="#c4b5fd" font-size="9.5" text-anchor="middle">• run_validators()</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 545 150 L 575 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Custom Field-Level -->
  <g transform="translate(580, 95)" filter="url(#shadow)">
    <rect width="165" height="110" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <rect width="165" height="28" rx="10" fill="#0369a1"/>
    <text x="82" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">STAGE 4: SINGLE FIELD</text>
    <text x="82" y="50" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">clean_&lt;field&gt;()</text>
    <text x="82" y="68" fill="#bae6fd" font-size="9.5" text-anchor="middle">• Inspects cleaned_data[k]</text>
    <text x="82" y="82" fill="#bae6fd" font-size="9.5" text-anchor="middle">• Raises ValidationError</text>
    <text x="82" y="96" fill="#bae6fd" font-size="9.5" text-anchor="middle">• MUST return value!</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 745 150 L 775 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: Form-Level Cross-Field -->
  <g transform="translate(780, 95)" filter="url(#shadow)">
    <rect width="145" height="110" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="145" height="28" rx="10" fill="url(#emeraldGrad)"/>
    <text x="72" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">STAGE 5: CROSS-FIELD</text>
    <text x="72" y="50" fill="#f1f5f9" font-size="12" font-weight="700" text-anchor="middle">clean() (Form-Level)</text>
    <text x="72" y="68" fill="#a7f3d0" font-size="9.5" text-anchor="middle">• Multi-field dependencies</text>
    <text x="72" y="82" fill="#a7f3d0" font-size="9.5" text-anchor="middle">• password == confirm</text>
    <text x="72" y="96" fill="#a7f3d0" font-size="9.5" text-anchor="middle">• Returns full dict</text>
  </g>

  <!-- Splitting Path: Down to Outcomes -->
  <path d="M 852 205 L 852 245 L 670 245 L 670 280" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 670 245 L 300 245 L 300 280" stroke="#38bdf8" stroke-width="2"/>

  <!-- Outcome A: Valid -->
  <g transform="translate(180, 285)" filter="url(#shadow)">
    <rect width="250" height="150" rx="10" fill="#064e3b" stroke="#059669" stroke-width="2"/>
    <circle cx="28" cy="28" r="14" fill="#059669"/>
    <path d="M 22 28 L 27 33 L 35 23" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="32" fill="#34d399" font-size="14" font-weight="800">is_valid() == True</text>
    <line x1="16" y1="52" x2="234" y2="52" stroke="#047857" stroke-width="1"/>
    <text x="20" y="74" fill="#a7f3d0" font-size="11" font-weight="700">• Populates form.cleaned_data</text>
    <text x="20" y="92" fill="#ecfdf5" font-size="10.5">All types safely cast &amp; validated</text>
    <text x="20" y="110" fill="#a7f3d0" font-size="11" font-weight="700">• form.errors is empty ({})</text>
    <text x="20" y="128" fill="#ecfdf5" font-size="10.5">Ready for form.save() or view logic</text>
  </g>

  <!-- Outcome B: Invalid -->
  <g transform="translate(545, 285)" filter="url(#shadow)">
    <rect width="250" height="150" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="2"/>
    <circle cx="28" cy="28" r="14" fill="#dc2626"/>
    <path d="M 23 23 L 33 33 M 33 23 L 23 33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="32" fill="#f87171" font-size="14" font-weight="800">is_valid() == False</text>
    <line x1="16" y1="52" x2="234" y2="52" stroke="#991b1b" stroke-width="1"/>
    <text x="20" y="74" fill="#fca5a5" font-size="11" font-weight="700">• Populates form.errors (ErrorDict)</text>
    <text x="20" y="92" fill="#fef2f2" font-size="10.5">Field errors &amp; Non-field '__all__'</text>
    <text x="20" y="110" fill="#fca5a5" font-size="11" font-weight="700">• Erroneous fields removed</text>
    <text x="20" y="128" fill="#fef2f2" font-size="10.5">Re-render form in template with errors</text>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(40, 452)">
    <circle cx="5" cy="5" r="4" fill="#38bdf8"/>
    <text x="16" y="8.5" fill="#94a3b8" font-size="10">Source: Django Framework Core Forms Specification &amp; Two Scoops of Django (Greenfeld &amp; Greenfeld)</text>
  </g>
</svg>
