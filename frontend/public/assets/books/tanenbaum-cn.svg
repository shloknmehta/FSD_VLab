<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="coverTan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
  </defs>

  <rect width="300" height="450" rx="8" fill="url(#coverTan)" stroke="#0284c7" stroke-width="2"/>
  <rect x="0" y="0" width="18" height="450" fill="#000000" opacity="0.3"/>

  <!-- Top Badge -->
  <rect x="36" y="24" width="228" height="24" rx="4" fill="#0c4a6e"/>
  <text x="150" y="40" fill="#bae6fd" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.5">PEARSON EDUCATION &bull; 6TH EDITION</text>

  <!-- Title -->
  <text x="150" y="110" fill="#ffffff" font-size="30" font-weight="900" text-anchor="middle">COMPUTER</text>
  <text x="150" y="142" fill="#38bdf8" font-size="28" font-weight="900" text-anchor="middle">NETWORKS</text>

  <!-- Illustration -->
  <g transform="translate(150, 235)">
    <circle cx="0" cy="0" r="50" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-8" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">CHAPTER 4</text>
    <text x="0" y="8" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">IEEE 802.1Q</text>
    <text x="0" y="24" fill="#bae6fd" font-size="9" text-anchor="middle">VLAN Tagging</text>
  </g>

  <!-- Highlight Box -->
  <rect x="36" y="335" width="228" height="44" rx="6" fill="#082f49" opacity="0.9" stroke="#38bdf8" stroke-width="1"/>
  <text x="150" y="353" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">CITED SECTION 4.8.4:</text>
  <text x="150" y="369" fill="#7dd3fc" font-size="9" text-anchor="middle">Virtual LANs &amp; IEEE 802.1Q Standards</text>

  <!-- Authors -->
  <text x="150" y="414" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Andrew S. Tanenbaum</text>
  <text x="150" y="430" fill="#94a3b8" font-size="11" text-anchor="middle">&amp; David J. Wetherall</text>
</svg>
