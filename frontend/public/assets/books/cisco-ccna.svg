<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="coverCisco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
  </defs>

  <rect width="300" height="450" rx="8" fill="url(#coverCisco)" stroke="#14b8a6" stroke-width="2"/>
  <rect x="0" y="0" width="18" height="450" fill="#000000" opacity="0.3"/>

  <!-- Top Badge -->
  <rect x="36" y="24" width="228" height="24" rx="4" fill="#134e4a"/>
  <text x="150" y="40" fill="#ccfbf1" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.5">CISCO PRESS &bull; OFFICIAL CERT GUIDE</text>

  <!-- Title -->
  <text x="150" y="105" fill="#ffffff" font-size="32" font-weight="900" text-anchor="middle">CCNA 200-301</text>
  <text x="150" y="136" fill="#5eead4" font-size="20" font-weight="800" text-anchor="middle">OFFICIAL CERT GUIDE</text>
  <text x="150" y="158" fill="#ccfbf1" font-size="11" font-weight="600" text-anchor="middle">Implementing Ethernet VLANs &amp; Trunks</text>

  <!-- Graphic -->
  <g transform="translate(150, 235)">
    <circle cx="0" cy="0" r="50" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="0" y="-8" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">CHAPTER 8</text>
    <text x="0" y="8" fill="#5eead4" font-size="10" font-weight="700" text-anchor="middle">VLAN CONFIG</text>
    <text x="0" y="24" fill="#ccfbf1" font-size="8.5" text-anchor="middle">Trunk &amp; Access Modes</text>
  </g>

  <!-- Highlight Box -->
  <rect x="36" y="335" width="228" height="44" rx="6" fill="#134e4a" opacity="0.9" stroke="#2dd4bf" stroke-width="1"/>
  <text x="150" y="353" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">CITED CHAPTER 8:</text>
  <text x="150" y="369" fill="#5eead4" font-size="9" text-anchor="middle">Implementing Ethernet Virtual LANs</text>

  <!-- Author -->
  <text x="150" y="416" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Wendell Odom, CCIE</text>
</svg>
