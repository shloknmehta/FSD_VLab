<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="coverBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="scoop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="scoop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Book Spine & Shadow -->
  <rect width="300" height="450" rx="8" fill="url(#coverBg1)" stroke="#0284c7" stroke-width="2"/>
  <rect x="0" y="0" width="18" height="450" fill="#000000" opacity="0.25"/>

  <!-- Top Badges -->
  <rect x="36" y="24" width="228" height="24" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <text x="150" y="40" fill="#e0f2fe" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.5">INDUSTRY STANDARD REFERENCE</text>

  <!-- Title -->
  <text x="150" y="100" fill="#ffffff" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="-0.5">TWO SCOOPS</text>
  <text x="150" y="128" fill="#38bdf8" font-size="22" font-weight="800" text-anchor="middle">OF DJANGO</text>

  <!-- Subtitle -->
  <text x="150" y="152" fill="#bae6fd" font-size="11" font-weight="600" text-anchor="middle">Best Practices for Python &amp; Django</text>

  <!-- Illustration: Two Ice Cream Scoops -->
  <g transform="translate(150, 230)">
    <!-- Cone -->
    <polygon points="0,95 -45,15 45,15" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <line x1="-30" y1="35" x2="30" y2="35" stroke="#b45309" stroke-width="1.5"/>
    <line x1="-20" y1="55" x2="20" y2="55" stroke="#b45309" stroke-width="1.5"/>
    <line x1="-10" y1="75" x2="10" y2="75" stroke="#b45309" stroke-width="1.5"/>

    <!-- Bottom Scoop -->
    <circle cx="0" cy="10" r="42" fill="url(#scoop2)" stroke="#92400e" stroke-width="1.5"/>
    <!-- Top Scoop -->
    <circle cx="0" cy="-40" r="38" fill="url(#scoop1)" stroke="#9f1239" stroke-width="1.5"/>
    <!-- Cherry -->
    <circle cx="0" cy="-82" r="10" fill="#e11d48"/>
    <path d="M 0 -92 Q 15 -110 25 -105" stroke="#15803d" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Highlight Box: Chapters 10 & 11 -->
  <rect x="36" y="340" width="228" height="42" rx="6" fill="#0f172a" opacity="0.8" stroke="#38bdf8" stroke-width="1"/>
  <text x="150" y="357" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">CITED CHAPTERS 10 &amp; 11:</text>
  <text x="150" y="372" fill="#38bdf8" font-size="9.5" text-anchor="middle">Form Basics, clean() &amp; Custom Validation</text>

  <!-- Authors -->
  <text x="150" y="412" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Daniel Roy Greenfeld</text>
  <text x="150" y="428" fill="#94a3b8" font-size="10" text-anchor="middle">&amp; Audrey Roy Greenfeld</text>
</svg>
