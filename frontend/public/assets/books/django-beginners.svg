<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="coverBeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <rect width="300" height="450" rx="8" fill="url(#coverBeg)" stroke="#10b981" stroke-width="2"/>
  <rect x="0" y="0" width="18" height="450" fill="#000000" opacity="0.3"/>

  <!-- Top Banner -->
  <rect x="36" y="24" width="228" height="24" rx="4" fill="#065f46"/>
  <text x="150" y="40" fill="#a7f3d0" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.5">WELCOMETOCODE PUBLISHING</text>

  <!-- Title -->
  <text x="150" y="105" fill="#ffffff" font-size="30" font-weight="900" text-anchor="middle">DJANGO</text>
  <text x="150" y="136" fill="#6ee7b7" font-size="22" font-weight="800" text-anchor="middle">FOR BEGINNERS</text>
  <text x="150" y="160" fill="#d1fae5" font-size="11" font-weight="600" text-anchor="middle">Build Websites with Python &amp; Django</text>

  <!-- Graphic -->
  <g transform="translate(150, 240)">
    <circle cx="0" cy="0" r="50" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="-8" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">FORMS &amp;</text>
    <text x="0" y="10" fill="#6ee7b7" font-size="11" font-weight="800" text-anchor="middle">VALIDATION</text>
    <text x="0" y="26" fill="#a7f3d0" font-size="8.5" text-anchor="middle">Clean Data Pipeline</text>
  </g>

  <!-- Highlight Box: Section on Forms -->
  <rect x="36" y="335" width="228" height="44" rx="6" fill="#022c22" opacity="0.9" stroke="#34d399" stroke-width="1"/>
  <text x="150" y="353" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">CITED SECTION:</text>
  <text x="150" y="369" fill="#d1fae5" font-size="9" text-anchor="middle">User Registration Forms &amp; ValidationError</text>

  <!-- Author -->
  <text x="150" y="416" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">William S. Vincent</text>
