<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="coverFor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
  </defs>

  <rect width="300" height="450" rx="8" fill="url(#coverFor)" stroke="#ef4444" stroke-width="2"/>
  <rect x="0" y="0" width="18" height="450" fill="#000000" opacity="0.3"/>

  <!-- Top Badge -->
  <rect x="36" y="24" width="228" height="24" rx="4" fill="#450a0a"/>
  <text x="150" y="40" fill="#fecaca" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.5">MCGRAW-HILL &bull; 5TH EDITION</text>

  <!-- Title -->
  <text x="150" y="105" fill="#ffffff" font-size="24" font-weight="900" text-anchor="middle">DATA COMMUNICATIONS</text>
  <text x="150" y="132" fill="#fca5a5" font-size="22" font-weight="900" text-anchor="middle">&amp; NETWORKING</text>

  <!-- Graphic -->
  <g transform="translate(150, 235)">
    <circle cx="0" cy="0" r="50" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
    <text x="0" y="-8" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">CHAPTER 15</text>
    <text x="0" y="8" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">VIRTUAL LANs</text>
    <text x="0" y="24" fill="#fecaca" font-size="9" text-anchor="middle">Switch Architecture</text>
  </g>

  <!-- Highlight Box -->
  <rect x="36" y="335" width="228" height="44" rx="6" fill="#450a0a" opacity="0.9" stroke="#f87171" stroke-width="1"/>
  <text x="150" y="353" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">CITED CHAPTER 15:</text>
  <text x="150" y="369" fill="#fca5a5" font-size="9" text-anchor="middle">Connecting Devices and Virtual LANs</text>

  <!-- Author -->
  <text x="150" y="416" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Behrouz A. Forouzan</text>
