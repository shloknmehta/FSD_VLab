<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="coverEx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
  </defs>

  <rect width="300" height="450" rx="8" fill="url(#coverEx)" stroke="#f97316" stroke-width="2"/>
  <rect x="0" y="0" width="18" height="450" fill="#000000" opacity="0.3"/>

  <!-- Top Banner: Packt -->
  <rect x="36" y="24" width="228" height="24" rx="4" fill="#9a3412"/>
  <text x="150" y="40" fill="#ffedd5" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.5">PACKT PUBLISHING &bull; 5TH EDITION</text>

  <!-- Title -->
  <text x="150" y="105" fill="#ffffff" font-size="30" font-weight="900" text-anchor="middle">DJANGO 5</text>
  <text x="150" y="136" fill="#fed7aa" font-size="24" font-weight="800" text-anchor="middle">BY EXAMPLE</text>
  <text x="150" y="160" fill="#ffedd5" font-size="10.5" font-weight="600" text-anchor="middle">Build powerful Python web applications</text>

  <!-- Graphic -->
  <g transform="translate(150, 240)">
    <rect x="-60" y="-35" width="120" height="70" rx="8" fill="#431407" stroke="#fdba74" stroke-width="1.5"/>
    <text x="0" y="-12" fill="#fdba74" font-size="11" font-weight="800" text-anchor="middle">FORM ENGINE</text>
    <text x="0" y="6" fill="#ffffff" font-size="9" text-anchor="middle">Security &amp; Sanitization</text>
    <text x="0" y="22" fill="#fed7aa" font-size="8.5" font-family="monospace" text-anchor="middle">clean() &amp; CSRF</text>
  </g>

  <!-- Highlight Box: Chapter 3 -->
  <rect x="36" y="335" width="228" height="44" rx="6" fill="#431407" opacity="0.9" stroke="#fb923c" stroke-width="1"/>
  <text x="150" y="353" fill="#fed7aa" font-size="10" font-weight="700" text-anchor="middle">CITED CHAPTERS 2 &amp; 3:</text>
  <text x="150" y="369" fill="#ffedd5" font-size="9" text-anchor="middle">User Submissions, Forms &amp; Cross-Field Checks</text>

  <!-- Author -->
  <text x="150" y="416" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Antonio Mele</text>
</svg>
